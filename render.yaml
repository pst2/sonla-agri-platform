services:
  - type: web
    name: sonla-agri-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "sh -c 'export PYTHONPATH=$PYTHONPATH:. && cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: API_V1_STR
        value: /api/v1
      - key: SECRET_KEY
        generateValue: true

